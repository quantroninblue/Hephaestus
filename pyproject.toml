[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hephaestus-ai"
version = "0.1.0.dev0"
description = "Robotics engineering CLI foundation for Hephaestus AI."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "quantroninblue" }]
dependencies = [
    "groq>=0.13",
    "pint>=0.24",
    "platformdirs>=4.3",
    "pydantic>=2.8",
    "rich>=13.7",
    "textual>=6.6,<7",
    "typer>=0.12",
]

[project.optional-dependencies]
cad = [
    "cadquery>=2.8,<2.9",
]
dev = [
    "hypothesis>=6.112",
    "pytest>=8.2",
    "ruff>=0.5",
]

[project.scripts]
hephaestus = "hephaestus.cli:app"

[project.urls]
Repository = "https://github.com/quantroninblue/Hephaestus"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-p",
    "no:launch_testing",
    "-p",
    "no:launch_ros",
    "-p",
    "no:launch_testing_ros",
    "-p",
    "no:launch_testing_ros_pytest_entrypoint",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
